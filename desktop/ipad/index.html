        <h1>音には、どんな手ざわりがあるんだろう。</h1>
        <p class="subtitle">風・波・泡。<br>3つの自然音を、やわらかな触感として体験する。</p>
      </header>

      <section id="login-panel" class="panel login-panel" aria-labelledby="login-title">
        <h2 id="login-title">展示コントロールへのログイン</h2>
        <p>展示用 Windows パソコンのアクセスパスワードを入力してください。</p>
        <form id="login-form">
          <label for="password">アクセスパスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
            minlength="12" required>
          <button class="primary-button" type="submit">ログイン</button>
        </form>
        <p id="login-error" class="error" role="alert"></p>
      </section>

      <section id="control-panel" class="panel control-panel" hidden aria-labelledby="control-title">
        <div class="status-heading">
          <div>
            <p class="eyebrow">展示の状態</p>
            <h2 id="control-title">現在の状態</h2>
          </div>
          <span id="connection" class="connection" role="status">接続中</span>
        </div>
        <div class="phase-card" aria-live="polite">
          <span id="phase" class="phase">状態を確認中</span>
          <p id="phase-description"></p>
        </div>
        <button id="preview-play" class="preview-play" type="button" hidden>プレビューを再生</button>
        <p id="selection-error" class="error" role="alert"></p>
        <div class="experience-grid" aria-label="体験を選択">
          <button class="experience-button" type="button" data-experience="WIND"
            data-preview-src="/wind-preview.mp4" disabled>
            <img src="/wind-poster.png" alt="">
            <span class="card-shade"></span>
            <span class="touch-hint" aria-hidden="true">
              <span class="touch-hint__circle"></span><span>タッチして体験</span>
            </span>
            <span class="card-copy">
              <span class="card-heading">
                <span class="experience-title">風</span> <span class="experience-name" lang="en">WIND</span>
              </span>
              <span class="card-rule"></span>
              <span class="card-description">そっとなでるように、やさしく流れる。</span>
            </span>
          </button>
          <button class="experience-button" type="button" data-experience="WAVE"
            data-preview-src="/waves-preview.mp4" disabled>
            <img src="/waves-poster.png" alt="">
            <span class="card-shade"></span>
            <span class="touch-hint" aria-hidden="true">
              <span class="touch-hint__circle"></span><span>タッチして体験</span>
            </span>
            <span class="card-copy">
              <span class="card-heading">
                <span class="experience-title">波</span> <span class="experience-name" lang="en">WAVES</span>
              </span>
              <span class="card-rule"></span>
              <span class="card-description">寄せては返す、穏やかなリズム。</span>
            </span>
          </button>
          <button class="experience-button" type="button" data-experience="BUBBLE"
            data-preview-src="/bubbles-preview.mp4" disabled>
            <img src="/bubbles-poster.png" alt="">
            <span class="card-shade"></span>
            <span class="touch-hint" aria-hidden="true">
              <span class="touch-hint__circle"></span><span>タッチして体験</span>
            </span>
            <span class="card-copy">
              <span class="card-heading">
                <span class="experience-title">泡</span> <span class="experience-name" lang="en">BUBBLES</span>
              </span>
              <span class="card-rule"></span>
              <span class="card-description">ふわりと弾ける、軽やかな感触。</span>
            </span>
          </button>
        </div><div class="footnote"><svg class="touch-hand" viewBox="0 0 40 44" aria-hidden="true"><circle cx="17" cy="9" r="6" opacity=".45"/><path d="M14 17V9a3 3 0 0 1 6 0v12-4a2.5 2.5 0 0 1 5 0v4-2a2.5 2.5 0 0 1 5 0v7c0 7-4 12-10 12h-2c-3 0-5-1-7-4l-5-7a2.5 2.5 0 0 1 4-3l4 4V17z"/><path d="M9 10a8 8 0 0 1 16 0" opacity=".55"/></svg><span class="footnote-divider" aria-hidden="true"></span><p>気になる音を、ひとつ選んでください。</p></div>
      </section>

      <footer id="runtime-status">Windows の動作モードを確認しています</footer>
    </main>
    <section id="preparing" class="nt-preparing" aria-labelledby="preparing-title" hidden>
      <div class="nt-preparing__wrap">
        <section class="nt-preparing__stage" data-mode=""
          aria-label="体験準備のアニメーション">

                  <stop offset=".81" stop-color="#d7dcdf" /><stop offset="1" stop-color="#cbd3d6" />
                </radialGradient>
                <linearGradient id="nt-wave-fill" x1="0" y1="0" x2="1" y2="1">

                  <stop offset="1" stop-color="#e5ded2" />
                </linearGradient>
                <radialGradient id="nt-bubble-fill" cx="41%" cy="36%" r="76%">
                  <stop offset="0" stop-color="#fafbfb" stop-opacity=".95" />
                  <stop offset=".7" stop-color="#e7ecee" stop-opacity=".76" />
                  <stop offset="1" stop-color="#d7e0e3" stop-opacity=".81" />
                </radialGradient>
                <linearGradient id="nt-bubble-rim" x1="0" y1="0" x2="1" y2=".7">
                  <stop stop-color="#bcd5de" stop-opacity=".5" /><stop offset=".3" stop-color="#e5cfdb" stop-opacity=".58" />
                  <stop offset=".64" stop-color="#d6e6df" stop-opacity=".55" /><stop offset="1" stop-color="#d4ddec" stop-opacity=".6" />

                  <stop offset="1" stop-color="#ffffff" stop-opacity=".05" />
                </linearGradient>
                <filter id="nt-blur"><feGaussianBlur stdDeviation="10" /></filter>
                <radialGradient id="nt-veil" cx="52%" cy="34%">
                  <stop stop-color="#ffffff" stop-opacity=".34" /><stop offset="1" stop-color="#ffffff" stop-opacity="0" />
                </radialGradient>
              </defs>
              <ellipse cx="210" cy="124" rx="181" ry="107" fill="#d2dce1" opacity=".12" filter="url(#nt-blur)" />
              <g class="nt-preparing__breath">
                <g class="nt-preparing__ring" fill="none" stroke="#d4dfe3" stroke-width="1.2">
                  <ellipse cx="210" cy="120" rx="188" ry="109" /><ellipse cx="210" cy="120" rx="174" ry="101" />
                </g>
                <g class="nt-preparing__modepart nt-preparing__wind">
                  <ellipse cx="210" cy="120" rx="157" ry="91" fill="url(#nt-wind-fill)" stroke="#cbd3d5" stroke-width="1.3" />
                  <ellipse class="nt-preparing__wind-shine" cx="169" cy="75" rx="92" ry="31"
                    fill="url(#nt-warm-sheen)" filter="url(#nt-blur)" />
                </g>
                <g class="nt-preparing__modepart nt-preparing__wave">
                  <ellipse cx="210" cy="120" rx="157" ry="91" fill="url(#nt-wave-fill)" stroke="#b9cbd0" stroke-width="1.3" />
                  <ellipse cx="157" cy="84" rx="80" ry="25" fill="#fff" opacity=".16" filter="url(#nt-blur)" />
                </g>
                <g class="nt-preparing__modepart nt-preparing__bubble">
                  <ellipse cx="210" cy="120" rx="156" ry="91" fill="url(#nt-bubble-fill)" stroke="url(#nt-bubble-rim)" stroke-width="3" />
                  <ellipse cx="210" cy="120" rx="153" ry="88" fill="url(#nt-veil)" stroke="#fff" stroke-width="1.25" opacity=".65" />
                </g>
              </g>
            </svg>
          </div>

          <div class="nt-preparing__words">
            <p class="nt-preparing__eyebrow">エアーを整えています</p>
            <h1 id="preparing-title" class="nt-preparing__heading"></h1>
            <p class="nt-preparing__sub">しばらくお待ちください。</p>
          </div>

          <div class="nt-preparing__progress">
            <svg viewBox="0 0 340 58" role="presentation">
              <g class="nt-preparing__modepart nt-preparing__wind">
                <path d="M8 29 H332" stroke="#dfe2e2" stroke-width="1.45" fill="none" />
                <path class="nt-preparing__windgrow" pathLength="100" d="M8 29 H332"
                  stroke="#9bafb8" stroke-width="1.9" stroke-linecap="butt" fill="none" />

                  <path d="M6 24 C16 21 26 22 38 25" /><path d="M6 34 C18 35 28 34 41 31" />
                  <path d="M4 29 H28" />
                </g>
              </g>
              <g class="nt-preparing__modepart nt-preparing__wave">
                <path class="nt-preparing__wavegrow" pathLength="100"
                  d="M8 29 Q35 14 62 29 T116 29 T170 29 T224 29 T278 29 T332 29"

              </g>
            </svg>
          </div>

          <div class="nt-preparing__bubble-progress" aria-label="泡が順番に現れる準備アニメーション">
            <i class="nt-preparing__bubble-item nt-preparing__b1"></i>
            <i class="nt-preparing__bubble-item nt-preparing__b2"></i>
            <i class="nt-preparing__bubble-item nt-preparing__b3"></i>
            <i class="nt-preparing__bubble-item nt-preparing__b4"></i>
            <i class="nt-preparing__bubble-item nt-preparing__b5"></i>
          </div>
        </section>
      </div>
    </section>
